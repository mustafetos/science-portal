<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AZU Science</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">


        <!-- =====================================
             NAVIGATION BAR
        ====================================== -->

        <nav class="navbar">

            <div class="nav-container">


                <!-- =============================
                     TEAM LOGO + WEBSITE NAME
                ============================== -->

                <a href="#home" class="brand">

                    <img
                        src="images/header/FB_IMG_1788700938304.jpg"
                        alt="AZU Science Logo"
                        class="brand-logo"
                    >

                    <div class="brand-text">

                        <span class="brand-name">
                            AZU Science
                        </span>

                    </div>

                </a>


                <!-- =============================
                     DESKTOP NAVIGATION
                ============================== -->

                <div class="nav-links">

                    <a href="#home" class="nav-link active">
                        Home
                    </a>

                    <a href="#academic" class="nav-link">
                        Academic
                    </a>

                    <a href="#research" class="nav-link">
                        Research
                    </a>

                    <a href="#news" class="nav-link">
                        News
                    </a>

                    <a href="#about" class="nav-link">
                        About
                    </a>

                </div>


                <!-- =============================
                     HEADER ACTIONS
                ============================== -->

                <div class="header-actions">


                    <!-- Search Button -->

                    <button
                        type="button"
                        class="search-button"
                        aria-label="Search"
                    >

                        <span class="search-icon"></span>

                    </button>


                    <!-- Sign In Button -->

                    <a
                        href="#login"
                        class="sign-in-button"
                    >

                        Sign In

                    </a>


                    <!-- Mobile Menu Button -->

                    <button
                        type="button"
                        class="menu-button"
                        aria-label="Open menu"
                        aria-expanded="false"
                    >

                        <span></span>
                        <span></span>
                        <span></span>

                    </button>


                </div>

            </div>

        </nav>



        <!-- =====================================
             HERO BACKGROUND
        ====================================== -->

        <div
            class="header-background"
            style="
                background-image:
                url('images/header/IMG-20260906-WA0048.jpg');
            "
        >

        </div>



        <!-- =====================================
             HERO OVERLAY
        ====================================== -->

        <div class="header-overlay"></div>



        <!-- =====================================
             HERO CONTENT
        ====================================== -->

        <div class="header-content" id="home">


            <!-- Main Heading -->

            <div class="header-text">

                <p class="header-label">
                    FACULTY OF SCIENCE
                </p>


                <h1 class="header-title">

                    Explore.
                    <br>

                    Learn.
                    <br>

                    <span>Discover.</span>

                </h1>


                <p class="header-description">

                    Your gateway to academic resources,
                    research, knowledge, and everything
                    related to the Faculty of Science.

                </p>

            </div>



            <!-- Hero Buttons -->

            <div class="header-buttons">

                <a
                    href="#academic"
                    class="primary-button"
                >

                    Explore Academic

                </a>


                <a
                    href="#about"
                    class="secondary-button"
                >

                    Discover More

                </a>

            </div>


        </div>



        <!-- =====================================
             SCROLL INDICATOR
        ====================================== -->

        <a
            href="#academic"
            class="scroll-indicator"
            aria-label="Scroll to next section"
        >

            <span class="scroll-line"></span>

            <span class="scroll-text">
                Scroll to explore
            </span>

        </a>


    </header>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
